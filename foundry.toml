[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# Pharos Atlantic Testnet — chainId 688689
[rpc_endpoints]
pharos_atlantic = "https://atlantic.dplabs-internal.com"
pharos = "${PHAROS_RPC_URL}"

[etherscan]
pharos_atlantic = { key = "any", url = "https://api.socialscan.io/pharos-atlantic-testnet/v1/explorer/command_api/contract", chain = 688689 }
