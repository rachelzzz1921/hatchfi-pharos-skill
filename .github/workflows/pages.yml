name: Pages

# Publishes the landing page + operator console + pitch deck + dashboard to
# GitHub Pages. Enable once in repo Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build operator console
        run: npm run web:build
      - name: Assemble site
        run: |
          mkdir -p site/console site/deck
          cp -r dist-web/* site/console/
          cp -r docs/deck/* site/deck/
          cp web/landing.html site/index.html
          cp web/public/favicon.png site/favicon.png
          cp SUBMISSION_DASHBOARD.html site/dashboard.html
          cp web/public/run-events.jsonl site/console/run-events.jsonl 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
